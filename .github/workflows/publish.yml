name: Publish backlink articles to GitHub Pages

on:
  schedule:
    # 09:00 UTC daily = 17:00 China Standard Time
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'posts/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build static site from posts
        run: node scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
